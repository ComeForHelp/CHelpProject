<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 296" role="img" aria-label="Амурчик — тигрёнок-волонтёр с пакетом продуктов машет лапой">
  <defs>
    <radialGradient id="fur" cx="42%" cy="32%" r="75%">
      <stop offset="0" stop-color="#FFAB4F"/>
      <stop offset=".55" stop-color="#F28C26"/>
      <stop offset="1" stop-color="#DC6A10"/>
    </radialGradient>
    <radialGradient id="cream" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBE8D2"/>
    </radialGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C78BE"/>
      <stop offset="1" stop-color="#1A5590"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2AC72"/>
      <stop offset="1" stop-color="#C98D50"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M120 150c30 0 50 22 52 54 2 32-18 52-52 52s-54-20-52-52c2-32 22-54 52-54z"/>
    </clipPath>
    <style>
      .ol { stroke: #3A2418; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .bob { animation: bob 2.6s ease-in-out infinite; }
      .shadow { animation: shadow 2.6s ease-in-out infinite; transform-origin: 122px 286px; }
      .wave { animation: wave 1.8s ease-in-out infinite; transform-origin: 80px 182px; }
      .lines { animation: lines 1.8s ease-in-out infinite; }
      .tail { animation: tail 3.2s ease-in-out infinite; transform-origin: 78px 238px; }
      .bagsway { animation: bag 2.6s ease-in-out infinite; transform-origin: 184px 226px; }
      .eye { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .12; } 50% { transform: scaleX(.9); opacity: .08; } }
      @keyframes wave {
        0%, 100% { transform: rotate(0deg); }
        20% { transform: rotate(22deg); }
        40% { transform: rotate(-5deg); }
        60% { transform: rotate(20deg); }
        80% { transform: rotate(0deg); }
      }
      @keyframes lines { 0%, 100% { opacity: .2; } 20%, 60% { opacity: 1; } }
      @keyframes tail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-12deg); } }
      @keyframes bag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <ellipse class="shadow" cx="122" cy="286" rx="80" ry="7" fill="#3A2418" opacity=".12"/>

  <g class="bob">
    <!-- хвост -->
    <g class="tail">
      <path d="M78 238c-34 6-50-18-42-46" fill="none" stroke="#3A2418" stroke-width="19" stroke-linecap="round"/>
      <path d="M78 238c-34 6-50-18-42-46" fill="none" stroke="#F28C26" stroke-width="13" stroke-linecap="round"/>
      <path d="M78 238c-34 6-50-18-42-46" fill="none" stroke="#3A2418" stroke-width="13" stroke-dasharray="5 12" stroke-dashoffset="-8"/>
    </g>

    <!-- ноги -->
    <path class="ol" d="M92 234c0-8 24-8 24 0v32H92z" fill="url(#fur)"/>
    <path class="ol" d="M124 234c0-8 24-8 24 0v32h-24z" fill="url(#fur)"/>
    <path d="M94 246c5-2 10-2 14 0M126 246c5-2 10-2 14 0" fill="none" stroke="#3A2418" stroke-width="4" stroke-linecap="round"/>
    <path class="ol" d="M82 271c0-12 36-12 36 0 0 7-36 7-36 0z" fill="url(#cream)"/>
    <path class="ol" d="M122 271c0-12 36-12 36 0 0 7-36 7-36 0z" fill="url(#cream)"/>
    <path d="M95 267v5M105 267v5M135 267v5M145 267v5" stroke="#3A2418" stroke-width="2" stroke-linecap="round" opacity=".5"/>

    <!-- туловище и жилет волонтёра -->
    <path d="M120 150c30 0 50 22 52 54 2 32-18 52-52 52s-54-20-52-52c2-32 22-54 52-54z" fill="url(#fur)"/>
    <g clip-path="url(#bodyClip)">
      <ellipse cx="120" cy="214" rx="27" ry="38" fill="url(#cream)"/>
      <path d="M60 150h48c-5 38-5 76 2 110H60zM180 150h-48c5 38 5 76-2 110h50z" fill="url(#vest)"/>
      <path d="M108 152c-5 38-5 76 2 108M132 152c5 38 5 76-2 108" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/>
    </g>
    <path class="ol" d="M120 150c30 0 50 22 52 54 2 32-18 52-52 52s-54-20-52-52c2-32 22-54 52-54z" fill="none"/>
    <circle cx="88" cy="200" r="10.5" fill="#fff" stroke="#3A2418" stroke-width="2"/>
    <path d="M88 206.5s-5.8-3.5-5.8-7.6a3.2 3.2 0 0 1 5.8-1.7 3.2 3.2 0 0 1 5.8 1.7c0 4.1-5.8 7.6-5.8 7.6z" fill="#E86200"/>

    <!-- лапа с пакетом -->
    <path d="M162 182q14 18 20 40" fill="none" stroke="#3A2418" stroke-width="26" stroke-linecap="round"/>
    <path d="M162 182q14 18 20 40" fill="none" stroke="#F28C26" stroke-width="20" stroke-linecap="round"/>
    <path d="M162 182q8 10 12 20" fill="none" stroke="#2470B4" stroke-width="22" stroke-linecap="round"/>
    <g class="bagsway">
      <path d="M170 210l-10-38" stroke="#3A2418" stroke-width="12" stroke-linecap="round"/>
      <path d="M170 210l-10-38" stroke="#E9C27A" stroke-width="8" stroke-linecap="round"/>
      <path d="M163 186l5-2M166 196l5-2" stroke="#B9843A" stroke-width="2" stroke-linecap="round"/>
      <path class="ol" d="M197 238c-2-14 2-26 12-30 2 12-2 24-12 30z" fill="#4CAF50"/>
      <path class="ol" d="M190 238c-6-12-4-26 4-32 4 12 3 24-4 32z" fill="#3E9443"/>
      <path d="M169 238q15-24 30 0" fill="none" stroke="#7A4A1E" stroke-width="3.5"/>
      <path class="ol" d="M158 236h52l-4 44a4 4 0 0 1-4 4h-36a4 4 0 0 1-4-4z" fill="url(#bag)"/>
      <path d="M160 244h48" stroke="#A8743E" stroke-width="2"/>
      <path d="M184 272s-9-5.4-9-11.7a5 5 0 0 1 9-2.7 5 5 0 0 1 9 2.7c0 6.3-9 11.7-9 11.7z" fill="#fff"/>
    </g>
    <circle class="ol" cx="183" cy="227" r="11" fill="url(#cream)"/>

    <!-- голова -->
    <path class="ol" d="M58 74C48 52 52 30 70 26c16-3 28 10 32 20z" fill="url(#fur)"/>
    <path class="ol" d="M182 74c10-22 6-44-12-48-16-3-28 10-32 20z" fill="url(#fur)"/>
    <path d="M66 64c-4-14 0-26 8-28 8-1 14 6 16 12z" fill="url(#cream)"/>
    <path d="M174 64c4-14 0-26-8-28-8-1-14 6-16 12z" fill="url(#cream)"/>
    <path class="ol" d="M120 36c40 0 70 22 72 56 1 12-2 20 4 28-10 2-8 12-16 16-12 18-34 26-60 26s-48-8-60-26c-8-4-6-14-16-16 6-8 3-16 4-28 2-34 32-56 72-56z" fill="url(#fur)"/>
    <path d="M120 38c-4 10-6 18 0 28 6-10 4-18 0-28zM98 44c2 10 6 16 12 18-2-8-6-14-12-18zM142 44c-2 10-6 16-12 18 2-8 6-14 12-18z" fill="#3A2418"/>
    <path d="M50 92c10 0 18 3 24 7-8 2-16 1-24-1zM54 110c8-1 14 0 18 3-6 3-12 3-18 1zM190 92c-10 0-18 3-24 7 8 2 16 1 24-1zM186 110c-8-1-14 0-18 3 6 3 12 3 18 1z" fill="#3A2418"/>
    <path d="M120 112c-12-8-38-6-40 12-1 16 20 24 40 20 20 4 41-4 40-20-2-18-28-20-40-12z" fill="url(#cream)"/>
    <ellipse cx="80" cy="116" rx="9" ry="6" fill="#F26D7D" opacity=".4"/>
    <ellipse cx="160" cy="116" rx="9" ry="6" fill="#F26D7D" opacity=".4"/>
    <g class="eye">
      <ellipse cx="96" cy="95" rx="9.5" ry="11" fill="#2A1A10"/>
      <circle cx="92.5" cy="90.5" r="3.6" fill="#fff"/>
      <circle cx="99" cy="100" r="1.6" fill="#fff"/>
    </g>
    <g class="eye">
      <ellipse cx="144" cy="95" rx="9.5" ry="11" fill="#2A1A10"/>
      <circle cx="140.5" cy="90.5" r="3.6" fill="#fff"/>
      <circle cx="147" cy="100" r="1.6" fill="#fff"/>
    </g>
    <path d="M86 78q8-5 16-1M138 77q8-4 16 1" fill="none" stroke="#3A2418" stroke-width="3" stroke-linecap="round"/>
    <path d="M112 110q8-4 16 0-2 7-8 9-6-2-8-9z" fill="#D9566B" stroke="#3A2418" stroke-width="2" stroke-linejoin="round"/>
    <path d="M120 119v4m0 0q-4 6-10 3m10-3q4 6 10 3" fill="none" stroke="#2A1A10" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M100 124h.1M94 130h.1M140 124h.1M146 130h.1" stroke="#C9A58A" stroke-width="3" stroke-linecap="round"/>

    <!-- машущая лапа -->
    <g class="wave">
      <path d="M80 182q-16-6-24-18-8-10-16-24" fill="none" stroke="#3A2418" stroke-width="26" stroke-linecap="round"/>
      <path d="M80 182q-16-6-24-18-8-10-16-24" fill="none" stroke="#F28C26" stroke-width="20" stroke-linecap="round"/>
      <path d="M80 182q-14-5-22-15" fill="none" stroke="#2470B4" stroke-width="22" stroke-linecap="round"/>
      <circle class="ol" cx="39" cy="138" r="13" fill="url(#cream)"/>
      <path d="M33 132h.1M39 129h.1M45 132h.1" stroke="#E8A0A0" stroke-width="4" stroke-linecap="round"/>
      <path class="lines" d="M22 124q-5 10 0 20M14 118q-8 16 0 32" fill="none" stroke="#E86200" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
