name: backend

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: idu
          POSTGRES_PASSWORD: idu_password
          POSTGRES_DB: idu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U idu -d idu_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://idu:idu_password@localhost:5432/idu_test?schema=public
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      UPLOAD_DIR: ./uploads
      CRON_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Migrations
        run: npx prisma migrate deploy
      - name: Seed
        run: npx prisma db seed
      - name: E2E tests
        run: npm run test:e2e
